name: 'Create .env file'
description: 'This GitHub Action helps to create a .env file'
author: 'Alexey Savelyev'
inputs:
    is_envkey_allow_empty:
        description: 'Allow empty envkey_ values: true — replaced by default_envkey_value, false — the step fails'
        required: false
        default: 'true'
    default_envkey_value:
        description: 'Value for an empty envkey_ value'
        required: false
        default: '_'
    json_data:
        description: 'JSON object {"key": "value"}; its keys are added after the envkey_ keys'
        required: false
        default: ''
    is_json_allow_empty:
        description: 'Allow empty json_data values: true — replaced by default_json_value, false — the step fails'
        required: false
        default: 'true'
    default_json_value:
        description: 'Value for an empty json_data value'
        required: false
        default: '_'
    output_path:
        description: 'Path to the .env file, relative to the workspace; a missing directory is created'
        required: false
        default: '.env'

runs:
    using: 'node24'
    main: 'dist/index.js'
